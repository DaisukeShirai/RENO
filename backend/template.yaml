AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RENO MVP API without SQS

Globals:
  Function:
    Runtime: python3.12
    Timeout: 28
    MemorySize: 512
    Environment:
      Variables:
        TABLE_NAME: !Ref RenoTable
        ASSET_BUCKET: !Ref RenoAssetBucket
        OPENAI_API_KEY: !Ref OpenAIApiKey
        OPENAI_MODEL: !Ref OpenAIModel
        SES_FROM_EMAIL: !Ref SesFromEmail
        SES_TO_EMAIL: !Ref SesToEmail
        TOKEN_SECRET: !Ref TokenSecret

Parameters:
  OpenAIApiKey:
    Type: String
    NoEcho: true
    MinLength: 20
  OpenAIModel:
    Type: String
    Default: gpt-5-mini
  SesFromEmail:
    Type: String
    Default: ''
  SesToEmail:
    Type: String
    Default: ''
  TokenSecret:
    Type: String
    NoEcho: true
    MinLength: 32

Resources:
  RenoApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'*'"
        AllowMethods: "POST,OPTIONS"

  RenoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RenoTable
        - S3CrudPolicy:
            BucketName: !Ref RenoAssetBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RenoApi
            Path: /agent
            Method: post

  RenoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RenoAssetBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RenoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: reno-mvp-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]

Outputs:
  ApiUrl:
    Value: !Sub https://${RenoApi}.execute-api.${AWS::Region}.amazonaws.com/v1/agent
  UserPoolId:
    Value: !Ref RenoUserPool
  AssetBucket:
    Value: !Ref RenoAssetBucket
