version: 1
frontend:
  phases:
    build:
      commands:
        - node scripts/generate-config.mjs
        - rm -rf dist
        - mkdir -p dist
        - cp index.html dist/index.html
        - cp manifest.json dist/manifest.json
        - cp -R assets dist/assets
        - cp -R pages dist/pages
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
