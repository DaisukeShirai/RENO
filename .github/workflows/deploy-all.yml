name: Deploy backend for Amplify

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: reno-mvp

jobs:
  localstack-test:
    name: LocalStack test only
    uses: ./.github/workflows/localstack-test.yml

  deploy:
    name: Deploy backend for Amplify frontend
    needs: localstack-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate and build backend
        run: |
          sam validate --template-file backend/template.yaml --lint
          sam build --template-file backend/template.yaml

      - name: Deploy backend resources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$TOKEN_SECRET"
          PARAM_OVERRIDES=(
            "OpenAIApiKey=$OPENAI_API_KEY"
            "OpenAIModel=$OPENAI_MODEL"
            "TokenSecret=$TOKEN_SECRET"
          )
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"

      - name: Show deployed API URL for Amplify
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL"
          echo "RENO_API_URL=$API_URL"
          echo "Set this value in Amplify Hosting environment variables."
