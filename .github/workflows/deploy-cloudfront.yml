name: Deploy frontend to CloudFront

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  localstack-test:
    name: LocalStack test only
    uses: ./.github/workflows/localstack-test.yml

  deploy:
    name: Static frontend deployment
    needs: localstack-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate frontend configuration
        # API URLとSupabaseの公開設定だけをフロントへ渡す。OpenAIキーは絶対に渡さない。
        env:
          RENO_API_URL: ${{ vars.RENO_API_URL }}
          RENO_MOCK_CHAT: "false"
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$RENO_API_URL"
          node scripts/generate-config.mjs

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React frontend
        # 現行index.htmlと同一仕様のReact版をCloudFront配信用にビルドする。
        run: npm run build:react

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload static files to S3
        # HTMLとランタイム設定は即時反映、それ以外の静的資材は長期キャッシュする。
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          test -n "$FRONTEND_BUCKET"
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "assets/reno-config.js"
          aws s3 cp dist/index.html "s3://$FRONTEND_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/assets/reno-config.js "s3://$FRONTEND_BUCKET/assets/reno-config.js" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/javascript; charset=utf-8"

      - name: Invalidate CloudFront cache
        # 設定変更と画面変更をすぐ反映できる範囲だけ無効化する。
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$CLOUDFRONT_DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/index.html" "/assets/reno-config.js" "/pages/*"
