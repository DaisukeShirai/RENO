name: "SYNC: Mirror deployed fork main to upstream"

on:
  workflow_run:
    workflows:
      - "DEPLOY: Fork environment backend (SAM)"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    name: Sync deployed release to upstream main
    if: ${{ github.repository == 'DaisukeShirai/RENO' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Push deployed release to upstream main
        env:
          UPSTREAM_REPO_TOKEN: ${{ secrets.UPSTREAM_REPO_TOKEN }}
        run: |
          test -n "$UPSTREAM_REPO_TOKEN"
          git push "https://x-access-token:${UPSTREAM_REPO_TOKEN}@github.com/IFLAG-hps/RENO.git" \
            "HEAD:main"
