name: "PROD: Deploy backend to AWS (SAM)"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: reno-mvp

jobs:
  localstack-test:
    name: Pre-deploy LocalStack tests
    uses: ./.github/workflows/localstack-test.yml

  deploy:
    name: Deploy backend stack
    needs: localstack-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate and build backend
        # デプロイ前にSAMテンプレートを検証し、Lambda用の成果物を作成する。
        run: |
          sam validate --template-file backend/template.yaml --lint
          sam build --template-file backend/template.yaml

      - name: Deploy backend resources
        # OpenAIキーとトークン秘密鍵はLambdaにだけ渡し、フロントへ出力しない。
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          DEMO_PIN: ${{ vars.DEMO_PIN || '1234' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL || '' }}
          SES_TO_EMAIL: ${{ vars.SES_TO_EMAIL || '' }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$TOKEN_SECRET"
          PARAM_OVERRIDES=(
            "OpenAIApiKey=$OPENAI_API_KEY"
            "OpenAIModel=$OPENAI_MODEL"
            "TokenSecret=$TOKEN_SECRET"
            "DemoPin=$DEMO_PIN"
          )
          if [ -n "$ADMIN_EMAIL" ]; then PARAM_OVERRIDES+=("AdminEmail=$ADMIN_EMAIL"); fi
          # SES未使用時は空のパラメータを渡さず、テンプレートの既定値を使う。
          if [ -n "$SES_FROM_EMAIL" ]; then PARAM_OVERRIDES+=("SesFromEmail=$SES_FROM_EMAIL"); fi
          if [ -n "$SES_TO_EMAIL" ]; then PARAM_OVERRIDES+=("SesToEmail=$SES_TO_EMAIL"); fi
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${PARAM_OVERRIDES[@]}"

      - name: Show backend API URL
        # CloudFrontの更新は行わず、接続確認用にAPI URLだけ表示する。
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text
