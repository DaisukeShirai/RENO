name: "SYNC: Mirror tested environment branches to fork"

on:
  workflow_run:
    workflows:
      - "CI: Validate application"
    types:
      - completed
    branches:
      - main
      - staging
      - dev

permissions:
  contents: read

jobs:
  sync:
    name: Sync tested branch to Amplify fork
    if: ${{ github.repository == 'IFLAG-hps/RENO' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          # Do not persist GITHUB_TOKEN's HTTP auth header. It would override
          # FORK_REPO_TOKEN below and authenticate the push as github-actions[bot].
          persist-credentials: false

      - name: Push tested branch to fork
        env:
          FORK_REPO_TOKEN: ${{ secrets.FORK_REPO_TOKEN }}
        run: |
          test -n "$FORK_REPO_TOKEN"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          case "$BRANCH" in main|staging|dev) ;; *) echo "Unexpected branch: $BRANCH"; exit 1 ;; esac
          git push "https://x-access-token:${FORK_REPO_TOKEN}@github.com/DaisukeShirai/RENO.git" \
            "HEAD:$BRANCH"
