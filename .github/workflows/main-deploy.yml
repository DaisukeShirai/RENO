name: Test and deploy main

on:
  push:
    branches:
      - main
      - feature/makeActions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  STACK_NAME: reno-mvp

jobs:
  test:
    name: Test with LocalStack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade boto3

      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 4566:4566 \
            -e SERVICES=dynamodb,s3,ses \
            -e DEBUG=0 \
            localstack/localstack:stable

      - name: Run LocalStack smoke tests
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Show LocalStack logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs localstack

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file backend/template.yaml --lint

      - name: Build SAM application
        run: sam build --template-file backend/template.yaml

  deploy:
    name: Deploy to AWS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build SAM application
        run: sam build --template-file backend/template.yaml

      - name: Deploy SAM application
        run: >-
          sam deploy
          --template-file .aws-sam/build/template.yaml
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          OpenAIApiKey="${{ secrets.OPENAI_API_KEY }}"
          OpenAIModel="${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}"
          SesFromEmail="${{ vars.SES_FROM_EMAIL || '' }}"
          SesToEmail="${{ vars.SES_TO_EMAIL || '' }}"
          TokenSecret="${{ secrets.TOKEN_SECRET }}"
